# ---- JVM ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ---- Build performance ------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.unsafe.isolated-projects=false

# ---- Android ----------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# ---- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# ---- Backend ----------------------------------------------------------------
# Override in `local.properties` (never commit real keys):
#   studioone.supabase.url=https://<project-ref>.supabase.co
#   studioone.supabase.anonKey=<anon key>
studioone.supabase.url=https://placeholder.supabase.co
studioone.supabase.anonKey=public-anon-key-placeholder
