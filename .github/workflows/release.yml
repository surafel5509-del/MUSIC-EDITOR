# ─────────────────────────────────────────────────────────────────────────────
# Release: tag-driven Play Store deployment via Fastlane Supply.
# 1. Bump version from tag (vX.Y.Z -> versionName X.Y.Z, versionCode = run#)
# 2. Build signed AAB with upload keystore from CI secrets
# 3. Generate baseline profiles on a device (macrobenchmark)
# 4. fastlane supply to the internal track; promotion is manual
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track: { description: "Play track", default: "internal", type: choice, options: [internal, alpha, beta, production] }

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: play-store
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Materialize secrets
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > upload.jks
          cat > keystore.properties <<PROP
          storeFile=../upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROP
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > play-service-account.json

      - name: Build signed AAB + universal APKs
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease -Pci \
            -PversionNameOverride=${{ steps.version.outputs.version_name }} \
            -PversionCodeOverride=${{ steps.version.outputs.version_code }} \
            -PS1_SUPABASE_URL="${{ secrets.S1_SUPABASE_URL }}" \
            -PS1_SUPABASE_ANON_KEY="${{ secrets.S1_SUPABASE_ANON_KEY }}"

      - name: Deploy to Play (${{ inputs.track || 'internal' }})
        env:
          SUPPLY_JSON_KEY_DATA_PATH: play-service-account.json
        run: |
          cd fastlane && bundle exec fastlane supply \
            --track "${{ inputs.track || 'internal' }}" \
            --aab ../app/build/outputs/bundle/release/app-release.aab \
            --skip_upload_metadata=false --root_url "https://play.google.com"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/bundle/**/*.aab
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/*.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
