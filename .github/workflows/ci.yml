name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (app)
        run: gradle :app:lintDebug --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studioone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure native tests
        working-directory: audio/src/main/cpp
        run: cmake -B build -G Ninja -DBUILD_AUDIO_TESTS=ON
      - name: Build native tests
        working-directory: audio/src/main/cpp
        run: cmake --build build
      - name: Run native tests
        working-directory: audio/src/main/cpp/build
        run: ctest --output-on-failure
